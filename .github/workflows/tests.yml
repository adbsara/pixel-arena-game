name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the game package and the test tools
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest
          pip install -e . --no-deps

      - name: Run the tests
        run: pytest